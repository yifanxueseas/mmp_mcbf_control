#see .yaml files inside autotune folders for config templates

# env_name: "hospital"                #support: "hospital" or "vicon"
env_name: "social_nav_dynamic"                #support: "hospital" or "vicon"

radius: 0.7                         
num_dyn_circle: 7                   #no dynamic obstacle defined in "vicon" scenario, 
                                    #need to define your own dynamic obstacle 
                                    #trajectories to use

### Robot Path Settings:
dynamics: "differential"            #support: "omni-directional" or "differential"
# target: [-5., 0.]
# init_state: [-15.,-0.1]
# target: [-10., -5.5]
# init_state: [-6.,5.5]
# target: [-6., 5.5]
# init_state: [-10.,-5.5]
target: [4., 0.]
init_state: [-2.,0.]
# init_state: [0.,0]




### Controller Settings (fixed):
threeD_controller: False            #3D controller is not supported for robots with
                                    #"omni-directional" dynamics
nominal_speed: 1.0
MCBF: True                          #or False to use regular CBF

autotune: True                      #If true, automate selection of beta values.
                                    #If false, load manually adjusted beta values 
                                    #given robot locations relative to the obstacle. 
                                    #Handtuned controllers are only tuned for targets
                                    #provided in .yaml files under handtune folders. 

MMP: True